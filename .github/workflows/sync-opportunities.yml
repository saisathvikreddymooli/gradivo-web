name: Sync opportunities

on:
  schedule:
    # Once every 24 hours (03:00 UTC). Free GitHub-hosted runner.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      greenhouse_tokens:
        description: 'Comma-separated Greenhouse board tokens (blank = defaults)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run opportunity sync
        env:
          GREENHOUSE_TOKENS: ${{ inputs.greenhouse_tokens }}
        run: node --experimental-strip-types scripts/sync-opportunities.mjs

      - name: Commit updated data if changed
        run: |
          git config user.name "gradivo-sync"
          git config user.email "gradivo-sync@users.noreply.github.com"
          git add public/data/opportunities.json
          if git diff --cached --quiet; then
            echo "No opportunity changes."
          else
            git commit -m "chore: refresh opportunities data"
            git push
          fi
